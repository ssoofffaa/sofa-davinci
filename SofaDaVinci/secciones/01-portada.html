<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440">
    <title>Portada — Sofía Dziuba</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
    <style>
        /* standalone section: hoist content to the top of the page
           by negating the absolute Y offset of this section */
        .page { height: 1262px; }
        .page > * { transform: translateY(-0px); }
    </style>
</head>
<body>
<div class="page">
<header class="cover" id="portada">
        <img class="cover__bg-watercolor" src="../multimedia/imagenes/1-art-back.png" alt="" aria-hidden="true">
        <img class="cover__pond" src="../multimedia/imagenes/1-art-girl-back.png" alt="Autorretrato de Sofía entre nenúfares y peces koi">
        <img class="cover__flower-right" src="../multimedia/imagenes/1-art-flower-2-1.png" alt="" aria-hidden="true">
        <img class="cover__flower-left" src="../multimedia/imagenes/1-art-flower-1-1.png" alt="" aria-hidden="true">
        <img class="cover__bug-left" src="../multimedia/imagenes/1-art-bug-1.png" alt="" aria-hidden="true">
        <img class="cover__bug-right" src="../multimedia/imagenes/1-art-bug-2.png" alt="" aria-hidden="true">

        <nav class="cover__menu" aria-label="Menú principal">
            <a href="#pintura">Pintura</a>
            <a href="#ceramica">Cerámica</a>
            <a href="#joyas">Joyas</a>
            <a href="#grafico">Diseño grafico</a>
            <a href="#media">Redes sociales</a>
        </nav>

        <h1 class="cover__title">Enredada entre nenúfares</h1>

        <div class="cover__signature">
            <p class="cover__signature-name">Sofiia Dziuba</p>
            <p class="cover__signature-role">Diseñadora gráfica. Traduzco la botánica en píxeles, papel y porcelana.</p>
        </div>
    </header>
</div>

</body>
</html>
